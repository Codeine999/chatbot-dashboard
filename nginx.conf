server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # นโยบายความเป็นส่วนตัว: ไฟล์ static สาธารณะ (Facebook ใช้ตรวจแอป) ไม่ผ่าน SPA/ล็อกอิน
    location = /privacy {
        try_files /privacy.html =404;
    }
    location = /privacy/ {
        return 301 /privacy;
    }

    location / {
        try_files $uri /index.html;
    }
}